name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC) + provenance, as required for
# n8n community node verification. No NPM_TOKEN secret is used.
# Trigger: push a tag like v0.1.0 (it must match package.json "version").
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, needed for trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
